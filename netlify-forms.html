<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Netlify Form Detection</title>
</head>
<body>
<form name="vendor-partnership" method="POST" action="/" netlify data-netlify="true" netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="vendor-partnership">
  <input name="bot-field">
  <input name="first-name">
  <input name="last-name">
  <input name="company">
  <input name="job-title">
  <input name="email">
  <input name="phone">
  <input name="partnership-type">
  <textarea name="message"></textarea>
  <input name="privacy-acknowledgement">
</form>
<form name="submit-requirement" method="POST" action="/" netlify data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data">
  <input type="hidden" name="form-name" value="submit-requirement">
  <input name="bot-field">
  <input name="company">
  <input name="contact-name">
  <input name="email">
  <input name="job-title-skill">
  <input name="number-of-resources">
  <input name="location">
  <input name="work-arrangement">
  <input name="engagement-type">
  <input name="expected-duration">
  <input name="target-start-date">
  <input name="budget">
  <input type="file" name="attachment">
  <textarea name="job-description"></textarea>
  <textarea name="additional-notes"></textarea>
  <input name="privacy-acknowledgement">
</form>
<form name="talent-network" method="POST" action="/" netlify data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data">
  <input type="hidden" name="form-name" value="talent-network">
  <input name="bot-field">
  <input name="full-name">
  <input name="email">
  <input name="phone">
  <input name="current-location">
  <input name="primary-skill">
  <input name="years-experience">
  <input name="linkedin">
  <input name="preferred-engagement">
  <input type="file" name="resume">
  <textarea name="message"></textarea>
  <input name="privacy-acknowledgement">
</form>
<form name="contact" method="POST" action="/" netlify data-netlify="true" netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="contact">
  <input name="bot-field">
  <input name="name">
  <input name="email">
  <input name="company">
  <input name="inquiry-type">
  <textarea name="message"></textarea>
  <input name="privacy-acknowledgement">
</form>
</body>
</html>
